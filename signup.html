<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign Up - DVARY GAMES</title>
    
    <!-- Import Firebase SDKs -->
    <script type="importmap">
        {
            "imports": {
                "firebase/app": "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js",
                "firebase/analytics": "https://www.gstatic.com/firebasejs/10.7.0/firebase-analytics.js",
                "firebase/auth": "https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js",
                "firebase/firestore": "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js",
                "firebase/storage": "https://www.gstatic.com/firebasejs/10.7.0/firebase-storage.js"
            }
        }
    </script>
    
    <!-- CSS -->
    <link rel="stylesheet" href="style.css" />
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet" />
</head>
<body>
    <!-- ============================================
    AUTH PAGE CONTAINER
    ============================================ -->
    <div class="auth-page signup-page">
        <!-- Back Button -->
        <a href="index.html" class="auth-back-btn">
            <i class="fas fa-arrow-left"></i> Back to Home
        </a>
        
        <!-- Auth Card -->
        <div class="auth-card signup-card">
            <!-- Logo -->
            <div class="auth-logo">
                <i class="fas fa-gamepad"></i>
                <span>DVARY</span> GAMES
            </div>
            
            <h1 class="auth-title">Create Account</h1>
            <p class="auth-subtitle">Join the DVARY GAMES community today!</p>
            
            <!-- ============================================
            SIGNUP FORM
            ============================================ -->
            <form id="signupForm" class="auth-form" autocomplete="off">
                <!-- Full Name -->
                <div class="form-group">
                    <label for="fullName">
                        <i class="fas fa-user"></i> Full Name
                    </label>
                    <input 
                        type="text" 
                        id="fullName" 
                        name="fullName" 
                        placeholder="Enter your full name" 
                        required 
                        autocomplete="name"
                    />
                    <div class="form-error" id="fullNameError"></div>
                </div>
                
                <!-- Username -->
                <div class="form-group">
                    <label for="username">
                        <i class="fas fa-at"></i> Username
                    </label>
                    <input 
                        type="text" 
                        id="username" 
                        name="username" 
                        placeholder="Choose a unique username" 
                        required 
                        autocomplete="username"
                    />
                    <div class="form-error" id="usernameError"></div>
                    <small class="form-hint">3-20 characters, letters, numbers, underscore only</small>
                </div>
                
                <!-- Email -->
                <div class="form-group">
                    <label for="email">
                        <i class="fas fa-envelope"></i> Email Address
                    </label>
                    <input 
                        type="email" 
                        id="email" 
                        name="email" 
                        placeholder="Enter your email" 
                        required 
                        autocomplete="email"
                    />
                    <div class="form-error" id="emailError"></div>
                </div>
                
                <!-- Phone Number -->
                <div class="form-group">
                    <label for="phoneNumber">
                        <i class="fas fa-phone"></i> Phone Number (Optional)
                    </label>
                    <input 
                        type="tel" 
                        id="phoneNumber" 
                        name="phoneNumber" 
                        placeholder="Enter your phone number" 
                        autocomplete="tel"
                    />
                </div>
                
                <!-- Password -->
                <div class="form-group">
                    <label for="password">
                        <i class="fas fa-lock"></i> Password
                    </label>
                    <div class="password-wrapper">
                        <input 
                            type="password" 
                            id="password" 
                            name="password" 
                            placeholder="Create a strong password" 
                            required 
                            autocomplete="new-password"
                        />
                        <button type="button" class="toggle-password" id="togglePassword" aria-label="Toggle password visibility">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                    <div class="form-error" id="passwordError"></div>
                    <small class="form-hint">Must be at least 6 characters</small>
                </div>
                
                <!-- Confirm Password -->
                <div class="form-group">
                    <label for="confirmPassword">
                        <i class="fas fa-lock"></i> Confirm Password
                    </label>
                    <div class="password-wrapper">
                        <input 
                            type="password" 
                            id="confirmPassword" 
                            name="confirmPassword" 
                            placeholder="Confirm your password" 
                            required 
                            autocomplete="new-password"
                        />
                        <button type="button" class="toggle-password" id="toggleConfirmPassword" aria-label="Toggle password visibility">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                    <div class="form-error" id="confirmPasswordError"></div>
                </div>
                
                <!-- Terms and Conditions -->
                <div class="form-group terms-group">
                    <label class="checkbox-label">
                        <input type="checkbox" id="termsCheckbox" required />
                        <span class="checkmark"></span>
                        I agree to the 
                        <a href="#" class="terms-link">Terms of Service</a> 
                        and 
                        <a href="#" class="terms-link">Privacy Policy</a>
                    </label>
                    <div class="form-error" id="termsError"></div>
                </div>
                
                <!-- Signup Button -->
                <button type="submit" class="btn-primary auth-btn" id="signupBtn">
                    <i class="fas fa-user-plus"></i> Create Account
                </button>
                
                <!-- Loading State -->
                <div class="auth-loading" id="authLoading" style="display: none;">
                    <div class="spinner"></div>
                    <p>Creating your account...</p>
                </div>
                
                <!-- Message Area -->
                <div class="auth-error" id="authError" style="display: none;"></div>
                <div class="auth-success" id="authSuccess" style="display: none;"></div>
            </form>
            
            <!-- Login Link -->
            <div class="auth-footer">
                <p>
                    Already have an account? 
                    <a href="login.html" class="auth-link">Login</a>
                </p>
            </div>
        </div>
    </div>

    <!-- ============================================
    SCRIPTS
    ============================================ -->
    <script type="module">
        // ============================================
        // IMPORT FIREBASE SDKs
        // ============================================
        import { initializeApp } from "firebase/app";
        import { getAnalytics } from "firebase/analytics";
        import { 
            getAuth, 
            createUserWithEmailAndPassword,
            updateProfile,
            sendEmailVerification,
            signOut
        } from "firebase/auth";
        import { 
            getFirestore, 
            doc, 
            setDoc, 
            getDocs, 
            query, 
            where,
            collection,
            serverTimestamp 
        } from "firebase/firestore";
        import { getStorage } from "firebase/storage";

        // ============================================
        // FIREBASE CONFIGURATION
        // ============================================
        const firebaseConfig = {
            apiKey: "AIzaSyCmwASW4XXQ3O0AvsCM_r1WLlrUmGjYVxI",
            authDomain: "dvary-9a7d0.firebaseapp.com",
            projectId: "dvary-9a7d0",
            storageBucket: "dvary-9a7d0.firebasestorage.app",
            messagingSenderId: "107370806066",
            appId: "1:107370806066:web:4c2ce1e6f7b6c32909f52b",
            measurementId: "G-07361LFJEP"
        };

        // ============================================
        // INITIALIZE FIREBASE
        // ============================================
        const app = initializeApp(firebaseConfig);
        const analytics = getAnalytics(app);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const storage = getStorage(app);

        console.log('🔥 Firebase initialized successfully on signup page!');

        // ============================================
        // DOM ELEMENTS
        // ============================================
        const signupForm = document.getElementById('signupForm');
        const fullNameInput = document.getElementById('fullName');
        const usernameInput = document.getElementById('username');
        const emailInput = document.getElementById('email');
        const phoneInput = document.getElementById('phoneNumber');
        const passwordInput = document.getElementById('password');
        const confirmPasswordInput = document.getElementById('confirmPassword');
        const termsCheckbox = document.getElementById('termsCheckbox');
        const signupBtn = document.getElementById('signupBtn');
        const authLoading = document.getElementById('authLoading');
        const authError = document.getElementById('authError');
        const authSuccess = document.getElementById('authSuccess');
        
        // Error elements
        const fullNameError = document.getElementById('fullNameError');
        const usernameError = document.getElementById('usernameError');
        const emailError = document.getElementById('emailError');
        const passwordError = document.getElementById('passwordError');
        const confirmPasswordError = document.getElementById('confirmPasswordError');
        const termsError = document.getElementById('termsError');

        // Toggle buttons
        const togglePassword = document.getElementById('togglePassword');
        const toggleConfirmPassword = document.getElementById('toggleConfirmPassword');

        // ============================================
        // TOGGLE PASSWORD VISIBILITY
        // ============================================
        togglePassword.addEventListener('click', () => {
            const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordInput.setAttribute('type', type);
            togglePassword.querySelector('i').classList.toggle('fa-eye');
            togglePassword.querySelector('i').classList.toggle('fa-eye-slash');
        });

        toggleConfirmPassword.addEventListener('click', () => {
            const type = confirmPasswordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            confirmPasswordInput.setAttribute('type', type);
            toggleConfirmPassword.querySelector('i').classList.toggle('fa-eye');
            toggleConfirmPassword.querySelector('i').classList.toggle('fa-eye-slash');
        });

        // ============================================
        // VALIDATION FUNCTIONS
        // ============================================
        function validateEmail(email) {
            const re = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            return re.test(email);
        }

        function validateUsername(username) {
            const re = /^[a-zA-Z0-9_]{3,20}$/;
            return re.test(username);
        }

        function validatePassword(password) {
            return password.length >= 6;
        }

        function showError(message) {
            authError.textContent = message;
            authError.style.display = 'block';
            authSuccess.style.display = 'none';
            setTimeout(() => {
                authError.style.display = 'none';
            }, 6000);
        }

        function showSuccess(message) {
            authSuccess.textContent = message;
            authSuccess.style.display = 'block';
            authError.style.display = 'none';
        }

        function setLoading(isLoading) {
            if (isLoading) {
                signupBtn.style.display = 'none';
                authLoading.style.display = 'block';
                signupBtn.disabled = true;
            } else {
                signupBtn.style.display = 'flex';
                authLoading.style.display = 'none';
                signupBtn.disabled = false;
            }
        }

        function clearErrors() {
            authError.style.display = 'none';
            authSuccess.style.display = 'none';
            fullNameError.textContent = '';
            usernameError.textContent = '';
            emailError.textContent = '';
            passwordError.textContent = '';
            confirmPasswordError.textContent = '';
            termsError.textContent = '';
        }

        // ============================================
        // CHECK IF USERNAME EXISTS
        // ============================================
        async function isUsernameTaken(username) {
            try {
                const usersRef = collection(db, 'users');
                const q = query(usersRef, where('username', '==', username));
                const querySnapshot = await getDocs(q);
                return !querySnapshot.empty;
            } catch (error) {
                console.error('Error checking username:', error);
                return false;
            }
        }

        // ============================================
        // CHECK IF EMAIL EXISTS
        // ============================================
        async function isEmailTaken(email) {
            try {
                const usersRef = collection(db, 'users');
                const q = query(usersRef, where('email', '==', email));
                const querySnapshot = await getDocs(q);
                return !querySnapshot.empty;
            } catch (error) {
                console.error('Error checking email:', error);
                return false;
            }
        }

        // ============================================
        // SIGNUP FUNCTION
        // ============================================
        async function signupUser(userData) {
            try {
                const { fullName, username, email, phoneNumber, password } = userData;

                // Check if username is taken
                const usernameTaken = await isUsernameTaken(username);
                if (usernameTaken) {
                    usernameError.textContent = 'Username is already taken. Please choose another.';
                    setLoading(false);
                    return false;
                }

                // Check if email is taken
                const emailTaken = await isEmailTaken(email);
                if (emailTaken) {
                    emailError.textContent = 'Email is already registered. Please login instead.';
                    setLoading(false);
                    return false;
                }

                // Create user in Firebase Auth
                const userCredential = await createUserWithEmailAndPassword(auth, email, password);
                const user = userCredential.user;
                console.log('✅ User created in Firebase Auth:', user.uid);

                // Update profile with display name
                await updateProfile(user, {
                    displayName: fullName
                });

                // Send email verification (optional)
                try {
                    await sendEmailVerification(user);
                    console.log('✅ Verification email sent to:', email);
                } catch (emailError) {
                    console.error('Email verification error:', emailError);
                }

                // Create user document in Firestore
                const userDoc = {
                    uid: user.uid,
                    fullName: fullName,
                    username: username,
                    email: email,
                    phoneNumber: phoneNumber || '',
                    profilePicture: '',
                    isAdmin: false,
                    isBlocked: false,
                    emailVerified: false,
                    createdAt: serverTimestamp(),
                    updatedAt: serverTimestamp(),
                    lastLogin: serverTimestamp(),
                    gamesPlayed: 0,
                    favorites: [],
                    settings: {
                        darkMode: true,
                        language: 'en',
                        notifications: {
                            games: true,
                            chat: true,
                            updates: true
                        }
                    }
                };

                await setDoc(doc(db, 'users', user.uid), userDoc);
                console.log('✅ User document created in Firestore:', user.uid);

                // Store user info in localStorage
                localStorage.setItem('user', JSON.stringify({
                    uid: user.uid,
                    email: user.email,
                    displayName: fullName,
                    username: username,
                    profilePicture: ''
                }));

                console.log('✅ User registered successfully:', user.email);

                showSuccess('🎉 Account created successfully! Redirecting...');

                // Redirect to home page after 2 seconds
                setTimeout(() => {
                    window.location.href = 'index.html';
                }, 2000);

                return true;

            } catch (error) {
                console.error('Signup error:', error);
                
                let errorMessage = 'Registration failed. Please try again.';
                switch (error.code) {
                    case 'auth/email-already-in-use':
                        errorMessage = 'This email is already registered. Please login instead.';
                        break;
                    case 'auth/invalid-email':
                        errorMessage = 'Invalid email address.';
                        break;
                    case 'auth/operation-not-allowed':
                        errorMessage = 'Email/password accounts are not enabled.';
                        break;
                    case 'auth/weak-password':
                        errorMessage = 'Password is too weak. Please use at least 6 characters.';
                        break;
                    default:
                        errorMessage = error.message || 'Registration failed. Please try again.';
                }
                
                showError(errorMessage);
                setLoading(false);
                return false;
            }
        }

        // ============================================
        // FORM SUBMISSION
        // ============================================
        signupForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            // Clear previous errors
            clearErrors();
            
            // Get values
            const fullName = fullNameInput.value.trim();
            const username = usernameInput.value.trim();
            const email = emailInput.value.trim();
            const phoneNumber = phoneInput.value.trim();
            const password = passwordInput.value;
            const confirmPassword = confirmPasswordInput.value;
            const termsChecked = termsCheckbox.checked;
            
            // Validate
            let hasError = false;
            
            if (!fullName) {
                fullNameError.textContent = 'Full name is required.';
                hasError = true;
            } else if (fullName.length < 2) {
                fullNameError.textContent = 'Full name must be at least 2 characters.';
                hasError = true;
            }
            
            if (!username) {
                usernameError.textContent = 'Username is required.';
                hasError = true;
            } else if (!validateUsername(username)) {
                usernameError.textContent = 'Username must be 3-20 characters (letters, numbers, underscore only).';
                hasError = true;
            }
            
            if (!email) {
                emailError.textContent = 'Email is required.';
                hasError = true;
            } else if (!validateEmail(email)) {
                emailError.textContent = 'Please enter a valid email address.';
                hasError = true;
            }
            
            if (!password) {
                passwordError.textContent = 'Password is required.';
                hasError = true;
            } else if (!validatePassword(password)) {
                passwordError.textContent = 'Password must be at least 6 characters.';
                hasError = true;
            }
            
            if (!confirmPassword) {
                confirmPasswordError.textContent = 'Please confirm your password.';
                hasError = true;
            } else if (password !== confirmPassword) {
                confirmPasswordError.textContent = 'Passwords do not match.';
                hasError = true;
            }
            
            if (!termsChecked) {
                termsError.textContent = 'You must agree to the Terms of Service and Privacy Policy.';
                hasError = true;
            }
            
            if (hasError) return;
            
            // Show loading
            setLoading(true);
            
            // Attempt signup
            await signupUser({
                fullName,
                username,
                email,
                phoneNumber,
                password
            });
        });

        // ============================================
        // ENTER KEY SUPPORT
        // ============================================
        passwordInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                confirmPasswordInput.focus();
            }
        });

        confirmPasswordInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                signupForm.dispatchEvent(new Event('submit'));
            }
        });

        // ============================================
        // CHECK IF USER IS ALREADY LOGGED IN
        // ============================================
        auth.onAuthStateChanged((user) => {
            if (user) {
                console.log('⚠️ User already logged in:', user.email);
                // Redirect to home
                window.location.href = 'index.html';
            }
        });

        console.log('✅ Signup page ready!');
    </script>
</body>
  </html>
